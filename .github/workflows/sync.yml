name: Sync with OBDb

# Regenerates all profiles from the current OBDb repositories once a week (or on demand) and
# commits the result only if something changed. Our copy stays usable if OBDb goes away.
on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt

      - name: Clone OBDb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir obdb
          gh api --paginate "orgs/OBDb/repos?per_page=100" --jq '.[] | select(.archived | not) | .name' > obdb/repos.txt
          echo "$(wc -l < obdb/repos.txt) repositories"
          grep -vE '^\.|obdb\.community$' obdb/repos.txt |
            xargs -P 8 -I{} sh -c 'git clone -q --depth 1 "https://github.com/OBDb/{}.git" "obdb/{}" || echo "::warning::clone of {} failed"'

      # Profiles whose repository is missing in this run are kept (marked "sourceMissing" in the index)
      - name: Convert
        run: python tools/convert_obdb.py obdb . | tee convert.log

      - name: Check
        run: |
          python tools/validate.py
          python tools/run_tests.py | tee tests.log || true
          python tools/run_tests.py --update-known

      - name: Commit
        run: |
          git add -A profiles tests
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync with OBDb $(date -u +%F)" -m "$(tail -n1 convert.log)" -m "$(tail -n1 tests.log)"
          git push
