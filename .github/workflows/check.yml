name: Check

# Validates the profiles and decodes all recorded answers – only when profiles, tests or tools change
on:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "tests/**"
      - "tools/**"
      - "schema/**"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "profiles/**"
      - "tests/**"
      - "tools/**"
      - "schema/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Schema
        run: python tools/validate.py
      - name: Test cases
        run: python tools/run_tests.py --verbose
